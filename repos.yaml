repos:
  - id: /.*/
    allowed_overrides: [workflow]
    allowed_workflows: [wf-with-lint]
    # apply_requirements: [approved, mergeable]
    delete_source_branch_on_merge: true
    policy_check: true

policies:
  policy_sets:
    - name: no-iam
      path: policy/
      source: local
    
workflows:
  wf-with-lint:
    plan:
      steps:
        - init
        - run: tflint || true
        - plan